server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # Assets con hash en el nombre: cache largo
    location ~* \.(?:js|css|woff2?|glb|gltf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta que no sea un archivo existente cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
