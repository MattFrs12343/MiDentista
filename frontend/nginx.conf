server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # Assets con hash en el nombre: cache largo e inmutable
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Modelos 3D: el nombre de archivo NO tiene hash, así que "immutable" es
    # peligroso aquí (una descarga cortada o un modelo actualizado quedarían
    # pegados en el navegador hasta por 1 año). Cache corto con revalidación.
    location ~* \.(?:glb|gltf)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # API de la clínica: los datos vienen de Postgres, no del bundle
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # SPA: cualquier ruta que no sea un archivo existente cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El HTML siempre debe revalidarse para tomar el bundle nuevo
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
}
