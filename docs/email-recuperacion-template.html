<!--
  Template del correo "Reset Password" de Supabase Auth — version minimalista.
  IMPORTANTE: pegar esto en el modo "codigo fuente / HTML" del editor de
  Supabase (buscar un boton tipo "</>" o "Source" cerca del campo Message
  body) — si se pega en el modo de texto enriquecido/visual, la etiqueta
  <img> se pierde aunque el resto del texto se vea bien.

  Pegar en: Supabase -> Authentication -> Emails -> Templates -> Reset Password
  Variable de Supabase usada: {{ .ConfirmationURL }} (link de recuperacion).
-->
<body style="margin:0; padding:0; background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;">
    <tr>
      <td align="center" style="padding:56px 24px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <img
                src="https://aoarcxvqlidcvytkxbmq.supabase.co/storage/v1/object/public/branding/logo-mark-hd.jpg"
                alt="MiDentista"
                width="120"
                style="display:block; max-width:120px; width:100%; height:auto;"
              />
            </td>
          </tr>

          <!-- Titulo -->
          <tr>
            <td align="center" style="padding-bottom:12px;">
              <h1 style="margin:0; font-size:18px; line-height:1.4; color:#142845; font-weight:600;">
                Recuperá tu contraseña
              </h1>
            </td>
          </tr>

          <!-- Texto -->
          <tr>
            <td align="center" style="padding-bottom:28px;">
              <p style="margin:0; font-size:14px; line-height:1.6; color:#6b6659;">
                Tocá el botón para elegir una contraseña nueva para tu cuenta de MiDentista.
              </p>
            </td>
          </tr>

          <!-- Boton -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <a
                href="{{ .ConfirmationURL }}"
                style="display:inline-block; background-color:#142845; color:#ffffff; text-decoration:none; font-size:14px; font-weight:600; padding:13px 28px; border-radius:8px;"
              >
                Elegir contraseña nueva
              </a>
            </td>
          </tr>

          <!-- Nota -->
          <tr>
            <td align="center">
              <p style="margin:0; font-size:12px; line-height:1.6; color:#9a948a;">
                Expira en 1 hora. Si no fuiste vos, ignorá este correo.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
