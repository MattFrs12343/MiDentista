services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-midentista}
      POSTGRES_USER: ${POSTGRES_USER:-midentista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midentista}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./bd_5clinicas_midentista.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-midentista} -d ${POSTGRES_DB:-midentista}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
