services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-midentista}
      POSTGRES_USER: ${POSTGRES_USER:-midentista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midentista}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./bd_5clinicas_midentista.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-midentista} -d ${POSTGRES_DB:-midentista}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      # Si PGHOST está definido (p. ej. en .env, apuntando a Supabase u otra
      # base externa), server.js lo prioriza sobre DATABASE_URL.
      DATABASE_URL: postgres://${POSTGRES_USER:-midentista}:${POSTGRES_PASSWORD:-midentista}@db:5432/${POSTGRES_DB:-midentista}
      PGHOST: ${PGHOST:-}
      PGPORT: ${PGPORT:-}
      PGUSER: ${PGUSER:-}
      PGPASSWORD: ${PGPASSWORD:-}
      PGDATABASE: ${PGDATABASE:-}
      PGSSL: ${PGSSL:-}
      # Supabase Auth: credenciales y envío de correos de recuperación.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      PORT: "4000"
    volumes:
      - ./api/server.js:/app/server.js
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  # Desarrollo con hot-reload. Levantar con:
  #   docker compose --profile dev up -d dev
  # Luego abrir http://localhost:5173
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Vite corre dentro de la red de Docker, así que la API se alcanza por
      # el nombre del servicio, no por localhost (que sería el propio dev).
      API_ORIGIN: "http://api:4000"
    volumes:
      - ./frontend:/app
      - dev_node_modules:/app/node_modules
    ports:
      - "${DEV_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started
    stdin_open: true
    tty: true

volumes:
  db_data:
  dev_node_modules:
